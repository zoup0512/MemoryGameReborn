plugins {
    id 'com.android.application' version '8.13.2'
}

// Single source of truth for the version and the build timestamp: the manifest,
// BuildConfig and the APK file name all read from here. The timestamp formats are
// pinned to Locale.US so artifact names and in-app stamps stay stable on
// non-English machines.
def onlineEndpoint = (project.findProperty('onlineEndpoint') ?: 'ws://124.220.35.87:8091/ws').toString()
def endpointUri = new URI(onlineEndpoint)
if (!(endpointUri.scheme in ['ws', 'wss']) || !endpointUri.host || endpointUri.rawUserInfo
        || endpointUri.rawQuery || endpointUri.rawFragment || endpointUri.path != '/ws') {
    throw new GradleException('onlineEndpoint must be ws[s]://host[:port]/ws without credentials/query/fragment')
}
def accountUiTest = project.findProperty('accountUiTest')?.toString() == 'true'
// Temporary compatibility with the current WS deployment; set false to require TLS again.
def accountAllowHttp = (project.findProperty('accountAllowHttp') ?: 'true').toString()
if (!(accountAllowHttp in ['true', 'false'])) {
    throw new GradleException('accountAllowHttp must be true or false')
}
def appVersionCode = 74
def appVersionName = '3.6.3'
def buildTime = new Date()
def buildStamp = new java.text.SimpleDateFormat('yyyyMMdd-HHmm', java.util.Locale.US).format(buildTime)
def buildTimeText = new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss', java.util.Locale.US).format(buildTime)

android {
    namespace 'com.memory.brain.training.games'
    compileSdk 36
    // AGP 8 defaults this off; debug-only test hooks read BuildConfig.DEBUG.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.memory.brain.training.games'
        // Raised from 19 to 21 for the online PK mode: TLS 1.2 is enabled by
        // default from API 21, so WSS needs no manual SSLSocketFactory setup.
        minSdkVersion 21
        // Play Store requires API 35 from 2025-08. The app has no native
        // libraries or foreground services, so the API 29-35 migrations reduce
        // to exported components, PendingIntent mutability, receiver flags and
        // Android 15 edge-to-edge (see docs/androidx-migration.md).
        targetSdkVersion 35
        versionCode appVersionCode
        versionName appVersionName
        // The build stamp travels inside the package: a renamed or forwarded APK
        // can still be traced back to the build it came from.
        buildConfigField 'String', 'BUILD_TIME', "\"${buildTimeText}\""
        buildConfigField 'String', 'ONLINE_ENDPOINT', "\"${onlineEndpoint}\""
        buildConfigField 'boolean', 'ACCOUNT_ALLOW_HTTP', accountAllowHttp
        manifestPlaceholders = [buildTime: buildTimeText]
        vectorDrawables.useSupportLibrary = true
        // Only languages with real translations are bundled; everything else
        // would fall back to the English default anyway.
        resourceConfigurations += ['en', 'de', 'es', 'fr', 'pt', 'ru', 'uk', 'zh']
    }

    // ---- Release signing: local keystore.properties (hardening design 3.3) ----
    // The release keystore never enters the repository. This gitignored file
    // (created from keystore.properties.example) is what makes a plain
    // assembleRelease produce a signed package, and what lets
    // writeIntegrityAnchor / printReleaseCertSha256 read the release
    // certificate. Absent -> the build still succeeds but yields an
    // -unsigned package. The file is read as UTF-8 so non-ASCII keystore
    // paths survive.
    def keystorePropertiesFile = file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        def keystorePropertiesText = keystorePropertiesFile.getText('UTF-8')
        if (keystorePropertiesText.startsWith('\uFEFF')) {
            keystorePropertiesText = keystorePropertiesText.substring(1)
        }
        keystoreProperties.load(new StringReader(keystorePropertiesText))
        def missingKeys = ['storeFile', 'storePassword', 'keyAlias']
                .findAll { !keystoreProperties.getProperty(it) }
        if (!missingKeys.isEmpty()) {
            throw new GradleException("keystore.properties is incomplete: missing ${missingKeys.join(', ')} " +
                    '(see keystore.properties.example)')
        }
        def keystoreFile = file(keystoreProperties.getProperty('storeFile'))
        if (!keystoreFile.exists()) {
            throw new GradleException("keystore.properties storeFile not found: ${keystoreFile}")
        }
        if (project.findProperty('android.injected.signing.store.file') != null) {
            throw new GradleException('Signing configured twice: keystore.properties and ' +
                    'android.injected.signing.* are both present. Keep exactly one source, or the ' +
                    'integrity anchor would not match the signing certificate.')
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                // Empty keyPassword falls back to storePassword (AGP default).
                if (keystoreProperties.getProperty('keyPassword')) {
                    keyPassword keystoreProperties.getProperty('keyPassword')
                }
                // Empty storeType lets the toolchain pick (PKCS12 for modern
                // keytool keystores); legacy .jks files must set jks here.
                if (keystoreProperties.getProperty('storeType')) {
                    storeType keystoreProperties.getProperty('storeType')
                }
            }
        }
    }

    buildTypes {
        debug {
            if (project.findProperty('partyCloudUiTest')?.toString() == 'true') applicationIdSuffix '.cloudpartytest'
            else if (project.findProperty('partyUiTest')?.toString() == 'true') applicationIdSuffix '.partytest'
            else if (accountUiTest) applicationIdSuffix '.accounttest'
        }
        release {
            signingConfig signingConfigs.release
            // Client hardening P1 (docs/android-client-hardening-design.md §3):
            // R8 shrink/obfuscate + resource shrink. The rules start broad
            // because the restored codebase reflects heavily (ActiveAndroid,
            // Gson DTOs, ButterKnife); tighten only after full regression.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xmaxerrs' << '20000' << '-Xmaxwarns' << '20000'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Artifact naming: memory-game-<versionName>-<versionCode>-<variant>-<yyyyMMdd-HHmm>[-unsigned].apk,
// e.g. memory-game-3.6.3-74-release-20261013-1712.apk
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            // signingConfig is never null; only a config with a complete keystore
            // counts as signed (injected signing included). Overriding the file name
            // suppresses the -unsigned suffix AGP would add, so re-add it here.
            def unsigned = variant.signingConfig?.isSigningReady() ? '' : '-unsigned'
            // The public VariantOutput interface does not expose the file name, but the
            // implementation class carries the outputFileName property and Groovy
            // dispatches to it at runtime (the usual AGP 8.x route).
            output.outputFileName.set(
                    "memory-game-${appVersionName}-${appVersionCode}-${variant.name}-${buildStamp}${unsigned}.apk")
        }
    }
}

// Release distribution: after assembleRelease, copy this build's signed APK to the
// module-level release/ folder. Unsigned (-unsigned) packages stay in build/.
tasks.register('publishReleaseApk') {
    group = 'build'
    description = 'Copy the signed, version/timestamp-named release APK into release/'
    doLast {
        def apkDir = file("$buildDir/outputs/apk/release")
        // Only this build's output (same timestamp) - never a leftover of an earlier run
        def signedApks = (apkDir.listFiles() ?: []).findAll {
            it.name.endsWith('.apk') && it.name.contains(buildStamp) && !it.name.contains('-unsigned')
        }
        if (signedApks.isEmpty()) {
            logger.lifecycle("publishReleaseApk: no signed release APK for this build (${buildStamp}), release/ left untouched")
            return
        }
        def distDir = file("$projectDir/release")
        distDir.mkdirs()
        (signedApks + [new File(apkDir, 'output-metadata.json')]).each { f ->
            if (f.exists()) {
                new File(distDir, f.name).bytes = f.bytes
                logger.lifecycle("publishReleaseApk: release/${f.name}")
            }
        }
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'publishReleaseApk'
}

// ---- Release regression guard: reflective icg_ drawables ------------------
// MemoryApplicationModel.getAllCellDrawableIds() reads R.drawable field NAMES
// (prefix "icg_") via reflection, and Game5CountAllActivity.startLevel()
// crashed mid-match on 2026-10-15 because the first signed release shipped
// with those names renamed away (empty list -> nextInt(-1)). Fail the build
// when the packaged release APK no longer carries the names or the images,
// instead of shipping a client that dies inside Count'em All.
tasks.register('verifyReflectionKeep') {
    group = 'verification'
    description = 'Fail if the release APK lost the reflective icg_ drawable names or images'
    doLast {
        def apkDir = file("$buildDir/outputs/apk/release")
        def signed = (apkDir.listFiles() ?: []).findAll {
            it.name.endsWith('.apk') && !it.name.contains('-unsigned')
        }
        if (signed.isEmpty()) {
            logger.lifecycle('verifyReflectionKeep: no signed release APK in build/ - skipped')
            return
        }
        def apk = signed.max { it.lastModified() }
        def countBytes = { byte[] data, byte[] pattern ->
            int found = 0
            int from = 0
            while (from <= data.length - pattern.length) {
                int at = -1
                for (int i = from; i <= data.length - pattern.length; i++) {
                    boolean hit = true
                    for (int j = 0; j < pattern.length; j++) {
                        if (data[i + j] != pattern[j]) { hit = false; break }
                    }
                    if (hit) { at = i; break }
                }
                if (at < 0) { break }
                found++
                from = at + 1
            }
            return found
        }
        def pattern = 'icg_'.getBytes('UTF-8')
        def zip = new java.util.zip.ZipFile(apk)
        try {
            int dexHits = 0
            zip.entries().each { entry ->
                if (entry.name.endsWith('.dex')) {
                    dexHits += countBytes(zip.getInputStream(entry).bytes, pattern)
                }
            }
            int arscHits = countBytes(zip.getInputStream(zip.getEntry('resources.arsc')).bytes, pattern)
            logger.lifecycle("verifyReflectionKeep: ${apk.name} dex=${dexHits} arsc=${arscHits}")
            if (dexHits < 50) {
                throw new GradleException("Release dex lost the reflectively read R.drawable "
                        + "'icg_' field names (found ${dexHits}, need >= 50). "
                        + "MemoryApplicationModel.getAllCellDrawableIds() would be empty and "
                        + "Game5CountAllActivity would crash mid-match; keep the R\$drawable rule "
                        + 'in proguard-rules.pro.')
            }
            if (arscHits < 50) {
                // A healthy build reports ~94 (one arsc name entry per icg_
                // drawable); a shrunk/degenerate resource table drops far below.
                throw new GradleException("Release resources lost icg_ cell images (found "
                        + "${arscHits}, need >= 50); check tools:keep in res/raw/keep.xml.")
            }
        } finally {
            zip.close()
        }
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'verifyReflectionKeep'
}

// ---- Hardening P3: release certificate anchor -----------------------------
// (docs/android-client-hardening-design.md 5.1). Rewrites
// src/main/java/com/cube/memorygames/security/IntegrityAnchor.java with the
// XOR-split SHA-256 of the release signing certificate so the fingerprint
// never enters the dex as a literal. Stamp it (first match wins):
//   gradlew writeIntegrityAnchor "-PintegrityCertSha256=AB:CD:...:EF"
//   gradlew writeIntegrityAnchor            (release keystore via the
//                                            signingConfig DSL or
//                                            android.injected.signing.*)
// Record the fingerprint for the keystore docs:
//   gradlew printReleaseCertSha256
// Without a stamped anchor the sentinel enforces nothing (ANCHORED=false).
def releaseSigningCertificate = {
    def signingConfig = android.buildTypes.release.signingConfig
    def storeFile = null
    def storePassword = null
    def keyAlias = null
    def storeType = null
    if (signingConfig != null && signingConfig.isSigningReady()) {
        storeFile = signingConfig.storeFile
        storePassword = signingConfig.storePassword
        keyAlias = signingConfig.keyAlias
        storeType = signingConfig.storeType
    } else {
        // AGP CLI-injected signing (android.injected.signing.*) is applied to
        // the variant, not the buildType DSL — read the injected properties.
        def injected = project.findProperty('android.injected.signing.store.file')
        if (injected == null) {
            return null
        }
        storeFile = file(injected)
        storePassword = project.findProperty('android.injected.signing.store.password')
        keyAlias = project.findProperty('android.injected.signing.key.alias')
        storeType = project.findProperty('android.injected.signing.store.type')
    }
    def keyStore = java.security.KeyStore.getInstance(
            storeType ?: java.security.KeyStore.getDefaultType())
    storeFile.withInputStream { stream ->
        keyStore.load(stream, (storePassword ?: '').toCharArray())
    }
    return keyStore.getCertificate(keyAlias)
}

def sha256Hex = { byte[] bytes ->
    java.security.MessageDigest.getInstance('SHA-256')
            .digest(bytes).collect { String.format('%02X', it) }.join(':')
}

def bytesToHex = { byte[] bytes ->
    bytes.collect { String.format('%02X', it) }.join(':')
}

tasks.register('printReleaseCertSha256') {
    group = 'security'
    description = 'Print the SHA-256 fingerprint of the release signing certificate'
    doLast {
        def certificate = releaseSigningCertificate()
        if (certificate == null) {
            logger.lifecycle('printReleaseCertSha256: no release signing certificate available (unsigned build)')
            return
        }
        logger.lifecycle('release cert SHA-256: ' + sha256Hex(certificate.encoded))
    }
}

tasks.register('writeIntegrityAnchor') {
    group = 'security'
    description = 'Stamp the release certificate SHA-256 into IntegrityAnchor.java (XOR-split)'
    doLast {
        byte[] digest
        def explicit = project.findProperty('integrityCertSha256')
        if (explicit != null && explicit.toString().trim().length() > 0) {
            String hex = explicit.toString().replaceAll('[^0-9a-fA-F]', '')
            if (hex.length() != 64) {
                throw new GradleException(
                        "integrityCertSha256 must be 64 hex chars (32 bytes), got ${hex.length()}")
            }
            digest = new byte[32]
            (0..<32).each { i ->
                digest[i] = (byte) Integer.parseInt(hex.substring(i * 2, i * 2 + 2), 16)
            }
        } else {
            def certificate = releaseSigningCertificate()
            if (certificate == null) {
                throw new GradleException(
                        'No release signing certificate available. Pass -PintegrityCertSha256=<64 hex chars> ' +
                        'or run with the release keystore injected; leaving the anchor unconfigured ' +
                        'disables signature enforcement silently.')
            }
            digest = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded)
        }
        def random = new java.security.SecureRandom()
        int[] partA = new int[32]
        int[] partB = new int[32]
        (0..<32).each { i ->
            int mask = random.nextInt(256)
            partB[i] = mask
            partA[i] = (digest[i] & 0xFF) ^ mask
        }
        def fmt = { int[] arr ->
            arr.collect { String.valueOf(it) }
               .collate(8)
               .collect { chunk -> chunk.join(', ') }
               .join(',\n            ')
        }
        // ASCII-only template: written via platform encoding on Windows.
        file('src/main/java/com/cube/memorygames/security/IntegrityAnchor.java').text =
                '''package com.cube.memorygames.security;

/**
 * Release certificate anchor. GENERATED FILE - rewritten in place by
 * `gradlew writeIntegrityAnchor` (see build.gradle); do not hand-edit
 * the arrays.
 *
 * The 32-byte SHA-256 of the release signing certificate never appears as a
 * literal in the dex: it is stored XOR-split across two random int arrays
 * and only reassembled inside fingerprint(). With ANCHORED false
 * the sentinel enforces nothing - that is the state until the maintainer
 * stamps the real fingerprint (hardening design 5.1).
 */
final class IntegrityAnchor {

    static final boolean ANCHORED = true;
    static final int[] PART_A = new int[] {
            ''' + fmt(partA) + '''
    };
    static final int[] PART_B = new int[] {
            ''' + fmt(partB) + '''
    };

    static byte[] fingerprint() {
        if (!ANCHORED || PART_A.length == 0 || PART_A.length != PART_B.length) {
            return null;
        }
        byte[] out = new byte[PART_A.length];
        for (int i = 0; i < out.length; i++) {
            out[i] = (byte) ((PART_A[i] ^ PART_B[i]) & 0xFF);
        }
        return out;
    }

    private IntegrityAnchor() {
    }
}
'''
        logger.lifecycle('writeIntegrityAnchor: stamped SHA-256 ' + bytesToHex(digest))
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.android.support') {
            throw new GradleException("Legacy Support Library dependency is not allowed: ${details.requested}. Use AndroidX instead.")
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.collection:collection:1.4.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.customview:customview:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // Game 12 retains its original percentage-based sizing in all layout variants.
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'

    // ButterKnife: decompiled generated $$ViewBinder sources were removed;
    // bindings are regenerated by the annotation processor at build time.
    // 10.2.3 generates AndroidX bindings; keep resource IDs final for @BindView.
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    implementation 'com.google.code.gson:gson:2.7'

    // Online PK mode: pure-Java WebSocket client (Java 8 source level).
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'

    // The following libraries are vendored as decompiled sources under src/main/java
    // and therefore have no external dependency:
    //   com.activeandroid        (activeandroid 3.1.0-SNAPSHOT - no longer downloadable)
        //   com.squareup.picasso     (picasso)
    //   com.github.florent37.viewanimator
    //   com.github.mikephil.charting
    //   com.roughike.bottombar
    //   com.viewpagerindicator
    //   com.wenchao.cardstack
    //   uk.co.chrisjenx.calligraphy
}
