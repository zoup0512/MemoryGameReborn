plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.memory.brain.training.games'
    compileSdk 36
    // AGP 8 defaults this off; debug-only test hooks read BuildConfig.DEBUG.
    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.memory.brain.training.games'
        // Raised from 19 to 21 for the online PK mode: TLS 1.2 is enabled by
        // default from API 21, so WSS needs no manual SSLSocketFactory setup.
        minSdkVersion 21
        targetSdkVersion 26
        versionCode 74
        versionName '3.6.3'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs << '-Xmaxerrs' << '20000' << '-Xmaxwarns' << '20000'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Android support library (original 26.1.0 line, restored from google maven)
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:recyclerview-v7:26.1.0'
    implementation 'com.android.support:cardview-v7:26.1.0'
    implementation 'com.android.support:design:26.1.0'
    implementation 'com.android.support:multidex:1.0.1'

    // ButterKnife: decompiled generated $$ViewBinder sources were removed;
    // bindings are regenerated by the annotation processor at build time.
    // @Bind annotations were migrated to the @BindView API of 8.5.1 (the version pinned by the original build file)
    implementation 'com.jakewharton:butterknife:8.5.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.5.1'

    implementation 'com.google.code.gson:gson:2.7'

    // Online PK mode: pure-Java WebSocket client (no transitive dependencies,
    // works with the pre-AndroidX support 26.1.0 stack and Java 8 source level)
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'

    // The following libraries are vendored as decompiled sources under src/main/java
    // and therefore have no external dependency:
    //   com.activeandroid        (activeandroid 3.1.0-SNAPSHOT - no longer downloadable)
        //   com.squareup.picasso     (picasso)
    //   com.github.florent37.viewanimator
    //   com.github.mikephil.charting
    //   com.roughike.bottombar
    //   com.viewpagerindicator
    //   com.wenchao.cardstack
    //   uk.co.chrisjenx.calligraphy
}
