spring:
  datasource:
    url: jdbc:h2:mem:pk-test;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop

pk:
  season:
    duration-ms: 3600000
  anti-cheat:
    min-answers-for-check: 5
    # Production uses 0.7; the integration test's fixed cadence can only
    # demonstrate the mechanism at a looser factor.
    speed-factor: 0.9
    suspicion-threshold: 2
    restriction-matches: 2
  round-duration-override-ms: 2000
  min-level-interval-override-ms: 200
  bot-level-interval-override-ms: 300
  economy:
    entry-fee: 30
    win-coins: 50
    draw-coins: 15
    # Tests assert exact settlement balances; disable the welcome grant here.
    welcome-coins: 0
  timing:
    match-found-delay-ms: 300
    round-intermission-ms: 300
    round-grace-ms: 1500
    bot-wait-ms: 1500
    reconnect-window-ms: 3000
