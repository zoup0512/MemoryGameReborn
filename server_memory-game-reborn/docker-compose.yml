# Overseas single-box deployment for the online PK server (PRD decision D-2).
# Usage: cd server_memory-game-reborn && ./gradlew bootJar && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memorygames
      POSTGRES_USER: pk
      POSTGRES_PASSWORD: ${PK_DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pk -d memorygames"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pk-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PK_DB_PASSWORD: ${PK_DB_PASSWORD:-change-me}
      # Temporary HTTP compatibility; restore false after HTTPS/WSS is ready.
      PK_AUTH_ALLOW_HTTP: ${PK_AUTH_ALLOW_HTTP:-true}
      # Browser password login and automation tokens are independent.
      PK_ADMIN_TOKEN: ${PK_ADMIN_TOKEN:-}
      PK_ADMIN_PASSWORD_HASH: ${PK_ADMIN_PASSWORD_HASH:-}
      PK_ADMIN_SESSION_TTL_SECONDS: ${PK_ADMIN_SESSION_TTL_SECONDS:-28800}
      PK_ADMIN_MAX_SESSIONS: ${PK_ADMIN_MAX_SESSIONS:-1000}
      PK_ADMIN_LOGIN_RATE_LIMIT: ${PK_ADMIN_LOGIN_RATE_LIMIT:-5}
      PK_ADMIN_TRUST_FORWARDED_HEADERS: ${PK_ADMIN_TRUST_FORWARDED_HEADERS:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
