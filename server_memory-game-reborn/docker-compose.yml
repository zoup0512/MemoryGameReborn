# Overseas single-box deployment for the online PK server (PRD decision D-2).
# Usage: cd server_memory-game-reborn && ./gradlew bootJar && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memorygames
      POSTGRES_USER: pk
      POSTGRES_PASSWORD: ${PK_DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pk -d memorygames"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pk-server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PK_DB_PASSWORD: ${PK_DB_PASSWORD:-change-me}
      # README promises this passthrough; without it the admin API stays
      # disabled in compose deployments.
      PK_ADMIN_TOKEN: ${PK_ADMIN_TOKEN:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
