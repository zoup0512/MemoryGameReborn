plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.memorygames'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

springBoot {
    buildInfo()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.7'
}

tasks.named('test') {
    useJUnitPlatform()
    // The full-match integration test plays accelerated rounds through the
    // real WebSocket stack; give it room on slow CI machines.
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
