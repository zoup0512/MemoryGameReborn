spring:
  datasource:
    url: jdbc:h2:mem:pk-test;DB_CLOSE_DELAY=-1
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

pk:
  nickname:
    # Regression fixtures share application contexts; rate-limit behavior has dedicated unit tests.
    global-per-minute: 10000
    subject-per-minute: 100
  season:
    duration-ms: 3600000
  anti-cheat:
    min-answers-for-check: 5
    # Production uses 0.7; the integration test's fixed cadence can only
    # demonstrate the mechanism at a looser factor.
    speed-factor: 0.9
    suspicion-threshold: 2
    restriction-matches: 2
  round-duration-override-ms: 2000
  min-level-interval-override-ms: 200
  bot-level-interval-override-ms: 300
  economy:
    entry-fee: 30
    win-coins: 50
    draw-coins: 15
    # Register no longer imports a client-claimed balance; the welcome
    # grant is the only funding source, so tests assert against it.
    welcome-coins: 100
  timing:
    match-found-delay-ms: 300
    round-intermission-ms: 300
    round-grace-ms: 1500
    # Generous scoring tolerance keeps the 7-wins-per-round practice cadence
    # safe on slow CI while still closing before round-grace ends the round.
    score-accept-grace-ms: 1000
    bot-wait-ms: 1500
    reconnect-window-ms: 3000
