spring:
  application:
    name: memorygames-pk
  # Flyway owns the schema; Hibernate only validates its mappings against it.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:h2:mem:pk;DB_CLOSE_DELAY=-1
    username: sa
    password:

server:
  port: 8080
  # Do not let Spring implicitly trust forwarded scheme/host/IP headers.
  # Admin proxy support is opt-in via pk.admin.trust-forwarded-headers below.
  forward-headers-strategy: none
  # Stop accepting new connections/requests before beans die so the match
  # manager's room-voiding runs behind a closed door.
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: true

pk:
  # Automation credential; never used as a browser password.
  admin-token: ${PK_ADMIN_TOKEN:}
  # Fixed bcrypt hash only. Empty/invalid hash disables browser login.
  admin-password-hash: ${PK_ADMIN_PASSWORD_HASH:}
  admin:
    session-ttl-seconds: ${PK_ADMIN_SESSION_TTL_SECONDS:28800}
    max-sessions: ${PK_ADMIN_MAX_SESSIONS:1000}
    login-rate-limit: ${PK_ADMIN_LOGIN_RATE_LIMIT:5}
    trust-forwarded-headers: ${PK_ADMIN_TRUST_FORWARDED_HEADERS:false}

  nickname:
    # sensitive-word calls only this server's 127.0.0.1:18081; disabled rejects custom names.
    mode: ${PK_NICKNAME_MODERATION_MODE:sensitive-word}
    tencent-secret-id: ${PK_TENCENT_SECRET_ID:}
    tencent-secret-key: ${PK_TENCENT_SECRET_KEY:}
    tencent-session-token: ${PK_TENCENT_SESSION_TOKEN:}
    tencent-region: ${PK_TENCENT_TMS_REGION:ap-guangzhou}
    tencent-biz-type: ${PK_TENCENT_TMS_BIZ_TYPE:}
    audit-hmac-key: ${PK_NICKNAME_AUDIT_HMAC_KEY:}
    timeout-ms: ${PK_NICKNAME_TIMEOUT_MS:3000}
    max-concurrent: ${PK_NICKNAME_MAX_CONCURRENT:8}
    global-per-minute: ${PK_NICKNAME_GLOBAL_PER_MINUTE:60}
    subject-per-minute: ${PK_NICKNAME_SUBJECT_PER_MINUTE:5}

  diagnostics:
    # Up to ~192 MiB report content at the default capacity; no unbounded storage.
    max-reports: ${PK_DIAGNOSTICS_MAX_REPORTS:1000}
    cleanup-delay-ms: 3600000

  round-duration-override-ms: 0
  economy:
    entry-fee: 30
    win-coins: 50
    draw-coins: 15
  rating:
    initial-elo: 1000
    k-factor: 32
  match:
    rounds-per-match: 5
    elo-bucket-step: 100
    bucket-widen-steps: [1, 2, 4]
  timing:
    match-found-delay-ms: 3000
    round-intermission-ms: 6000
    practice-round-intermission-ms: ${PK_PRACTICE_ROUND_INTERMISSION_MS:2000}
    round-grace-ms: 10000
    score-accept-grace-ms: 2000
    bot-wait-ms: 15000
    reconnect-window-ms: 90000

logging:
  file:
    name: ${PK_LOG_FILE:./logs/memorygames-pk.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    com.memorygames.pk: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${PK_DB_HOST:postgres}:${PK_DB_PORT:5432}/${PK_DB_NAME:memorygames}
    username: ${PK_DB_USER:pk}
    password: ${PK_DB_PASSWORD:pk}
