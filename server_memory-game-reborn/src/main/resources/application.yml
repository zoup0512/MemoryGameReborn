spring:
  application:
    name: memorygames-pk
  # Flyway owns the schema; Hibernate only validates its mappings against it.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:h2:mem:pk;DB_CLOSE_DELAY=-1
    username: sa
    password:

server:
  port: 8080
  # Do not let Spring implicitly trust forwarded scheme/host/IP headers.
  # Admin proxy support is opt-in via pk.admin.trust-forwarded-headers below.
  forward-headers-strategy: none
  # Stop accepting new connections/requests before beans die so the match
  # manager's room-voiding runs behind a closed door.
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    defaults:
      enabled: true

pk:
  # Automation credential; never used as a browser password.
  admin-token: ${PK_ADMIN_TOKEN:}
  # Fixed bcrypt hash only. Empty/invalid hash disables browser login.
  admin-password-hash: ${PK_ADMIN_PASSWORD_HASH:}
  admin:
    session-ttl-seconds: ${PK_ADMIN_SESSION_TTL_SECONDS:28800}
    max-sessions: ${PK_ADMIN_MAX_SESSIONS:1000}
    login-rate-limit: ${PK_ADMIN_LOGIN_RATE_LIMIT:5}
    trust-forwarded-headers: ${PK_ADMIN_TRUST_FORWARDED_HEADERS:false}

  round-duration-override-ms: 0
  economy:
    entry-fee: 30
    win-coins: 50
    draw-coins: 15
  rating:
    initial-elo: 1000
    k-factor: 32
  match:
    rounds-per-match: 5
    elo-bucket-step: 100
    bucket-widen-steps: [1, 2, 4]
  timing:
    match-found-delay-ms: 3000
    round-intermission-ms: 6000
    round-grace-ms: 10000
    score-accept-grace-ms: 2000
    bot-wait-ms: 15000
    reconnect-window-ms: 90000

logging:
  level:
    com.memorygames.pk: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${PK_DB_HOST:postgres}:${PK_DB_PORT:5432}/${PK_DB_NAME:memorygames}
    username: ${PK_DB_USER:pk}
    password: ${PK_DB_PASSWORD:pk}
